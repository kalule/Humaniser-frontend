server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Section-draft SSE stream — a regex location, so it takes precedence over the plain-prefix
    # /api/ block below regardless of declaration order (nginx always prefers a matching regex
    # location over a prefix one unless the prefix uses ^~, which /api/ below does not).
    # proxy_buffering off is the part that actually matters here: without it nginx buffers the
    # whole upstream response before relaying it, which would silently turn this back into "wait
    # for everything, then flush" even though the backend itself is streaming correctly.
    # proxy_read_timeout is raised well past the
    # 5-minute hard cap ResearchController's stream endpoint enforces on itself, so nginx is never
    # the thing that cuts the connection early.
    location ~ ^/api/v[0-9]+/research/projects/[0-9a-fA-F-]+/sections/stream$ {
        proxy_pass            http://api:8080;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_buffering       off;
        proxy_cache           off;
        chunked_transfer_encoding on;
        proxy_read_timeout    360s;
        proxy_send_timeout    360s;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
